[package]
name = "rre"
version = "0.1.0"
edition = "2024"

[dependencies]
font8x8 = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minifb = "0.28.0"
radio = "0.12.1"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }