name: Build and Release Eyegore Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Assets and Binary into Zip
        run: |
          if (Test-Path eyegore_release) { Remove-Item -Recurse -Force eyegore_release }
          New-Item -ItemType Directory -Force -Path eyegore_release

          Copy-Item -Path target/release/rre.exe -Destination eyegore_release/ -Force

          if (Test-Path assets) {
              Copy-Item -Path assets -Destination eyegore_release/assets -Recurse -Force
          } else {
              Write-Warning "Warning: 'assets' folder not found on root directory."
          }

          Compress-Archive -Path eyegore_release/* -DestinationPath eyegore-windows.zip -Force
        shell: pwsh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: eyegore-windows.zip
          generate_release_notes: true
